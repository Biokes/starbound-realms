[workspace]
resolver = "2"

members = [
    "contracts/galaxy-map",
    "contracts/resources",
    "contracts/fleet",
    "contracts/battle",
    "contracts/integration-tests",
]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
